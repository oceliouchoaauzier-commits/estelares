<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ESTELARES - Agente Pessoal Modular">
    <title>ESTELARES</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="header-title">✨ ESTELARES</h1>
                <div class="header-status" id="status">Inicializando...</div>
            </div>
        </header>

        <main class="chat-container">
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="input" 
                        class="input-field" 
                        placeholder="Digite sua mensagem..."
                        autocomplete="off"
                    >
                    <button id="send-btn" class="send-btn">Enviar</button>
                </div>
                <div class="input-controls">
                    <button id="voice-btn" class="control-btn voice-btn" title="Voz">🎤</button>
                    <button id="clear-btn" class="control-btn clear-btn" title="Limpar">🗑️</button>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>ESTELARES v0.1.0 | Arquitetura Modular</p>
        </footer>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
